<div class="card-container">
    <div class="first-row">
        <img class="image" src={{srcImage}} alt="Foto de estetoscopio">
        <div class="title-comments">
            <h4>{{title}}</h4>
            <span>{{nroComments}} Posts</span>
        </div>
        <div class="button">
            <app-button text="Entrar" padding="10px" width="4rem" height="auto" routerLink={{uri}}/>
        </div>
    </div>
    <div class="second-row">
        <span>{{description}}</span>
    </div>
</div>
