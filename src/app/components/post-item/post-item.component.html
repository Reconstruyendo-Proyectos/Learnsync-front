<div class="post">
    <!-- Encabezado -->
    <div class="header-post">
        <img [src]="thread.user.profilePhoto" alt="Foto de perfil del Usuario" class="profile-user" />
        <div class="text">
            <span>{{ thread.user.username }}</span>
            <span>-</span>
            <span id="time">{{ publicationDate }}</span>
            <span>-</span>
            <span id="topic">{{ topic }}</span>
        </div>
    </div>

    <!-- Contenido -->
    <div class="title">
        <h1>{{ thread.title }}</h1>
    </div>
    <div class="content">
        <p>{{ thread.message }}</p>
        <!-- <img *ngIf="post.image" [src]="post.image" alt="Imagen del Post" class="image-post" /> -->
    </div>

    <!-- Footer -->
    <div class="footer-post">
        <button (click)="onLike()">
