<div class="post">
    <!-- Encabezado -->
    <div class="header-post">
        <img [src]="post.profilePicture" alt="Foto de perfil del Usuario" class="profile-user" />
        <div class="text">
            <span>{{ post.author }}</span>
            <span>-</span>
            <span id="time">{{ post.timeAgo }}</span>
            <span>-</span>
            <span id="topic">{{ post.topic }}</span>
        </div>
    </div>

    <!-- Contenido -->
    <div class="title">
        <h1>{{ post.title }}</h1>
    </div>
    <div class="content">
        <p>{{ post.content }}</p>
        <img *ngIf="post.image" [src]="post.image" alt="Imagen del Post" class="image-post" />
    </div>

    <!-- Footer -->
    <div class="footer-post">
        <button (click)="onLike()">
            <div class="icon-count">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-thumb-up" id="like">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M7 11v8a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1v-7a1 1 0 0 1 1 -1h3a4 4 0 0 0 4 -4v-1a2 2 0 0 1 4 0v5h3a2 2 0 0 1 2 2l-1 5a2 3 0 0 1 -2 2h-7a3 3 0 0 1 -3 -3" />
                </svg>
                <span class="count">{{ post.likes }}</span>
            </div>
        </button>
        <button (click)="onStar()">
            <div class="icon-count">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-star" id="star">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z" />
                </svg>
                <span class="count">{{ post.stars }}</span>
            </div>
        </button>
        <button (click)="onComments()">
            <div class="icon-count">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-message" id="comment">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M8 9h8" />
                    <path d="M8 13h6" />
                    <path
                        d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" />
                </svg>
                <span class="count">{{ post.comments }}</span>
            </div>
        </button>
    </div>
</div>
