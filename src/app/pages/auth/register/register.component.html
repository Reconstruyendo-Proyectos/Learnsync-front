<div class="container">
    <div class="auth">
        <h1>Registrate</h1>
        <form class="form-login" [formGroup]="registerForm" (ngSubmit)="submit()">
            <div class="register-inputs">
                <app-input typeInput="text" placeholder="Usuario" formControlName="username" />
                <app-input typeInput="email" placeholder="Email" formControlName="email" />
                <app-input typeInput="password" placeholder="Contraseña" formControlName="password" />
            </div>
            <app-button text="Registrate" padding="10px" width="15rem" hoverColor="#1f6f9b" radius="0" (click)="submit()" />
        </form>
        <p>¿Ya te has registrado? <span class="url" routerLink="/login">Inicia sesión aquí</span></p>
    </div>
    @if (showImage) {
      <div class="image">
          <img src="images/medicos-conversando.webp" alt="Imagen de médicos conversando">
      </div>
    }
</div>

<app-modal [isVisible]="isModalVisible" title="Cuenta Registrada"
    message="Tu cuenta ha sido registrada, revisa tu bandeja de entrada para activar tu cuenta. Si no encuentras el correo, intenta revisar en spam."
    (close)="closeModal()" />
