<main>
    <h1>Categorías</h1>

    <div class="category-container" *ngFor="let category of categories">
        <h2>{{category.name}}</h2>
        <div class="topics">
            <div *ngFor="let topic of category.topics">
                <app-card-topics srcImage={{topic?.topicIcon}} title={{topic?.name}} nroComments={{topic?.threads?.length}}
                description={{topic?.description}} slug="{{topic?.slug}}"/>
            </div>
        </div>
    </div>
</main>
