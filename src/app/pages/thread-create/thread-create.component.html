<div class="create">
  <h1>Crear hilo en r/{{ topicSlug() }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <input formControlName="title" placeholder="Título *" class="input">
    <textarea formControlName="message" placeholder="Texto (opcional si subes imagen)" rows="6" class="input"></textarea>

    <div class="upload">
      <span class="upload-label">Imagen (opcional)</span>
      <input type="file" accept="image/*" (change)="onFile($event)" id="fileInput">
      @if (uploading()) { <span class="hint">Subiendo…</span> }
      @if (fileUrl()) { <img [src]="fileUrl()!" alt="preview" class="preview"> }
    </div>

    <button type="submit" class="btn" [disabled]="submitting() || uploading()">
      {{ submitting() ? 'Publicando…' : 'Publicar' }}
    </button>
  </form>
</div>
