<h1>{{h1}}</h1>
<div class="about-container">
    <div class="about-left">
        @for (p of pList1; track p) { <p>{{p}}</p> }
        <ul class="list-benefits">
            @for (item of list; track item) { <li>{{item}}</li> }
        </ul>
        @for (p of pList2; track p) { <p>{{p}}</p> }
    </div>
    <div class="about-right about-image">
        <img class="image" [src]="srcImage" [alt]="altText">
    </div>
</div>
