<header>
    <div class="header">
        @if (isSidebarVisible) {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2 menu" (click)="toggleSidebar()" (keydown.enter)="toggleSidebar()" tabindex="0" role="button">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M4 6l16 0" />
              <path d="M4 12l16 0" />
              <path d="M4 18l16 0" />
          </svg>
        }
        <img class="logo" src="Logo.png" alt="Logo de Learnsync" routerLink = "/">
        <app-search-bar />
        @if (isAuthenticated) {
          <app-notification-icon [image]="user.profilePhoto"/>
        } @else {
          <app-auth-buttons/>
        }
    </div>
</header>
